<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4D4"/>
      <stop offset="30%" stop-color="#E5C778"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B32"/>
    </linearGradient>

    <linearGradient id="emHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A43"/>
      <stop offset="50%" stop-color="#0F4332"/>
      <stop offset="100%" stop-color="#08291F"/>
    </linearGradient>

    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#092B20" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left Side: Scaled Vector Emblem Crest -->
  <g transform="translate(18, 12)" filter="url(#hShadow)">
    <!-- Outer scalloped circle -->
    <circle cx="78" cy="78" r="72" fill="url(#emHGrad)" stroke="url(#goldHGrad)" stroke-width="3"/>
    <circle cx="78" cy="78" r="66" fill="none" stroke="url(#goldHGrad)" stroke-width="1" stroke-dasharray="2,3"/>
    
    <!-- White Inner Core -->
    <circle cx="78" cy="78" r="48" fill="#FFFFFF" stroke="url(#goldHGrad)" stroke-width="2"/>
    
    <!-- Academic Cap & Gear in Center -->
    <g transform="translate(78, 68) scale(0.48)">
      <polygon points="0,-28 50,-8 0,12 -50,-8" fill="#0F4332"/>
      <path d="M -26 0 Q -26 20 0 22 Q 26 20 26 0 Z" fill="#09281E"/>
      <circle cx="0" cy="-8" r="3.5" fill="url(#goldHGrad)"/>
      <path d="M 0 -8 Q 24 -4 30 10 Q 35 22 33 30" fill="none" stroke="url(#goldHGrad)" stroke-width="2"/>
      <polygon points="30,28 36,30 33,40 28,37" fill="url(#goldHGrad)"/>
    </g>

    <text x="78" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0F4332" letter-spacing="1.5">
      IPTI
    </text>
    <text x="78" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="700" fill="#C5A059" letter-spacing="1">
      ESTD 2018
    </text>

    <!-- Top & Bottom Arc Text (Scalable) -->
    <text x="78" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.8" font-weight="800" fill="url(#goldHGrad)" letter-spacing="0.8">
      INSTITUTE OF PROFESSIONAL TRAINING
    </text>
    <text x="78" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.2" font-weight="700" fill="#FFFFFF" letter-spacing="0.9">
      ★ ISO 9001:2015 CERTIFIED ★
    </text>
  </g>

  <!-- Vertical Divider Accent -->
  <line x1="184" y1="28" x2="184" y2="152" stroke="url(#goldHGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="184" cy="90" r="4" fill="url(#goldHGrad)"/>

  <!-- Right Side: Executive Institutional Typography -->
  <g transform="translate(208, 0)">
    <!-- Primary Acronym & Tagline -->
    <text x="0" y="66" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="900" fill="#0F4332" letter-spacing="-0.03em">
      IPTI
    </text>

    <!-- Accreditation Tag Badge -->
    <rect x="132" y="34" width="138" height="24" rx="12" fill="#F4EEDC" stroke="#C5A059" stroke-width="1"/>
    <text x="201" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#8C6A23" letter-spacing="0.06em">
      INSTITUTE • EST. 2018
    </text>

    <!-- Full Institutional Name -->
    <text x="0" y="98" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#1B2E24" letter-spacing="0.04em">
      INSTITUTE OF PROFESSIONAL TRAINING &amp; INNOVATION
    </text>

    <!-- Subtitle & Government / ISO Accreditations -->
    <text x="0" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#526A5E">
      Premier Center for Industrial Automation, Robotics, Embedded Systems &amp; AI
    </text>

    <!-- Verified Badges Row -->
    <g transform="translate(0, 148)">
      <circle cx="5" cy="-4" r="4" fill="#0F4332"/>
      <text x="14" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#0F4332" letter-spacing="0.05em">
        ISO 9001:2015
      </text>

      <text x="110" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#8C6A23">|</text>

      <circle cx="128" cy="-4" r="4" fill="#C5A059"/>
      <text x="138" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#8C6A23" letter-spacing="0.05em">
        GOVT. RECOGNIZED CO-OP
      </text>

      <text x="290" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#8C6A23">|</text>

      <circle cx="308" cy="-4" r="4" fill="#0F4332"/>
      <text x="318" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#0F4332" letter-spacing="0.05em">
        500+ HIRING PARTNERS
      </text>
    </g>
  </g>
</svg>
