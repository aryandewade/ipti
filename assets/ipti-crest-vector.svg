<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4D4"/>
      <stop offset="25%" stop-color="#E5C778"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="75%" stop-color="#9E7B32"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A43"/>
      <stop offset="50%" stop-color="#0F4332"/>
      <stop offset="100%" stop-color="#092B20"/>
    </linearGradient>

    <radialGradient id="goldSheen" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>

    <filter id="sealShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#092B20" flood-opacity="0.25"/>
    </filter>

    <!-- Circular text paths -->
    <path id="textCircleTop" d="M 86 256 A 170 170 0 1 1 426 256" fill="none"/>
    <path id="textCircleBottom" d="M 426 256 A 170 170 0 0 1 86 256" fill="none"/>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Outer Gear Teeth (24 Teeth) -->
    <g fill="url(#goldGrad)">
      <!-- Circle of gear teeth -->
      <path d="
        M 256 18 L 268 18 L 274 44 L 286 46 L 302 24 L 314 27 L 314 53 L 326 58 L 347 40 L 358 46 L 352 72 L 362 79 L 387 67 L 396 76 L 384 100 L 393 109 L 420 103 L 426 114 L 409 135 L 416 146 L 443 147 L 446 159 L 424 177 L 428 189 L 454 197 L 454 210 L 428 222 L 429 235 L 454 249 L 451 262 L 424 268 L 421 281 L 444 300 L 438 312 L 412 312 L 405 324 L 424 347 L 415 357 L 391 350 L 382 360 L 396 386 L 385 394 L 363 381 L 352 390 L 360 417 L 348 423 L 330 405 L 318 411 L 320 438 L 307 442 L 293 420 L 280 423 L 276 450 L 263 452 L 256 427 L 249 452 L 236 450 L 232 423 L 219 420 L 205 442 L 192 438 L 194 411 L 182 405 L 164 423 L 152 417 L 160 390 L 149 381 L 127 394 L 116 386 L 130 360 L 121 350 L 97 357 L 88 347 L 107 324 L 100 312 L 74 312 L 68 300 L 91 281 L 88 268 L 61 262 L 58 249 L 83 235 L 84 222 L 58 210 L 58 197 L 84 189 L 88 177 L 66 159 L 69 147 L 96 146 L 103 135 L 86 114 L 92 103 L 119 109 L 128 100 L 116 76 L 125 67 L 150 79 L 160 72 L 154 46 L 165 40 L 186 58 L 198 53 L 198 27 L 210 24 L 226 46 L 238 44 Z" />
    </g>

    <!-- Outer Gold Scalloped Ring -->
    <circle cx="256" cy="256" r="218" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Concentric Bead Ring -->
    <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3, 5"/>

    <!-- Dark Emerald Text Channel -->
    <circle cx="256" cy="256" r="192" fill="#0C3427" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Circular Typography: Top Arc -->
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="800" fill="url(#goldGrad)" letter-spacing="3.2">
      <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
        INSTITUTE OF PROFESSIONAL TRAINING &amp; INNOVATION
      </textPath>
    </text>

    <!-- Circular Typography: Bottom Arc -->
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" letter-spacing="4.5">
      <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
        ★ PUNE • ISO 9001:2015 CERTIFIED ★
      </textPath>
    </text>

    <!-- Inner Golden Border Ring with Rope Pattern -->
    <circle cx="256" cy="256" r="142" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="256" cy="256" r="134" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Center White Disc Background -->
    <circle cx="256" cy="256" r="130" fill="#FFFFFF"/>

    <!-- Inner Subtle Engineering Grid -->
    <circle cx="256" cy="256" r="110" fill="none" stroke="#E2EBE6" stroke-width="1"/>
    <line x1="256" y1="140" x2="256" y2="370" stroke="#E8EFEA" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="140" y1="256" x2="370" y2="256" stroke="#E8EFEA" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Center Graphic: Industrial Gear & Academic Cap Symbolism -->
    <!-- Gear -->
    <g transform="translate(256, 240) scale(0.68)">
      <path d="M -30 -75 L 30 -75 L 26 -52 Q 40 -46 52 -38 L 73 -50 L 105 -18 L 93 3 Q 95 18 92 32 L 115 45 L 98 85 L 75 79 Q 63 90 48 98 L 48 122 L 6 126 L -6 126 L -6 98 Q -21 90 -33 79 L -56 85 L -73 45 L -50 32 Q -53 18 -51 3 L -63 -18 L -31 -50 L -10 -38 Q 4 -46 18 -52 Z" 
            fill="#0F4332" opacity="0.12"/>
    </g>

    <!-- Laurel Wreath of Academic Excellence -->
    <g stroke="url(#goldGrad)" fill="none" stroke-width="2.5" stroke-linecap="round">
      <!-- Left Laurel Branch -->
      <path d="M 180 290 C 168 250 174 200 205 170"/>
      <ellipse cx="178" cy="245" rx="7" ry="3.5" transform="rotate(-35 178 245)" fill="url(#goldGrad)"/>
      <ellipse cx="173" cy="222" rx="7" ry="3.5" transform="rotate(-20 173 222)" fill="url(#goldGrad)"/>
      <ellipse cx="180" cy="198" rx="7" ry="3.5" transform="rotate(-5 180 198)" fill="url(#goldGrad)"/>
      <ellipse cx="195" cy="180" rx="7" ry="3.5" transform="rotate(15 195 180)" fill="url(#goldGrad)"/>

      <!-- Right Laurel Branch -->
      <path d="M 332 290 C 344 250 338 200 307 170"/>
      <ellipse cx="334" cy="245" rx="7" ry="3.5" transform="rotate(35 334 245)" fill="url(#goldGrad)"/>
      <ellipse cx="339" cy="222" rx="7" ry="3.5" transform="rotate(20 339 222)" fill="url(#goldGrad)"/>
      <ellipse cx="332" cy="198" rx="7" ry="3.5" transform="rotate(5 332 198)" fill="url(#goldGrad)"/>
      <ellipse cx="317" cy="180" rx="7" ry="3.5" transform="rotate(-15 317 180)" fill="url(#goldGrad)"/>
    </g>

    <!-- Center Academic Cap (Mortarboard) -->
    <g transform="translate(256, 218)">
      <!-- Cap Diamond -->
      <polygon points="0,-32 58,-10 0,12 -58,-10" fill="#0F4332"/>
      <polygon points="0,-27 48,-10 0,7 -48,-10" fill="#175F48"/>
      
      <!-- Skullcap underneath -->
      <path d="M -32 -2 Q -32 24 0 26 Q 32 24 32 -2 Z" fill="#0A3024"/>
      
      <!-- Tassel & Band -->
      <circle cx="0" cy="-10" r="4.5" fill="url(#goldGrad)"/>
      <path d="M 0 -10 Q 30 -6 38 12 Q 44 26 42 36" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <polygon points="38,34 46,36 42,48 36,44" fill="url(#goldGrad)"/>
    </g>

    <!-- Prominent Acronym "IPTI" in Center -->
    <text x="256" y="292" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#0F4332" letter-spacing="3">
      IPTI
    </text>
    <text x="256" y="308" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#C5A059" letter-spacing="2.5">
      ESTD 2018
    </text>

    <!-- Latin/Sanskrit Motto Ribbon Banner -->
    <g transform="translate(256, 335)">
      <!-- Ribbon Back Ends -->
      <path d="M -90 10 L -105 18 L -90 26 Z" fill="#08251C"/>
      <path d="M 90 10 L 105 18 L 90 26 Z" fill="#08251C"/>

      <!-- Ribbon Body -->
      <path d="M -85 0 L 85 0 Q 92 0 92 8 L 90 18 Q 90 26 82 26 L -82 26 Q -90 26 -90 18 L -92 8 Q -92 0 -85 0 Z" 
            fill="url(#goldGrad)" stroke="#8C6D27" stroke-width="1"/>
      <text x="0" y="17" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#0F4332" letter-spacing="1.2">
        EXCELLENCE IN INNOVATION
      </text>
    </g>

    <!-- Highlight Glass Sheen Overlay -->
    <circle cx="256" cy="256" r="218" fill="url(#goldSheen)" pointer-events="none"/>
  </g>
</svg>
