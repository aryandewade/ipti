<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8A5"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#99772B"/>
    </linearGradient>

    <linearGradient id="monoEm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166249"/>
      <stop offset="50%" stop-color="#0F4332"/>
      <stop offset="100%" stop-color="#07241A"/>
    </linearGradient>

    <filter id="monoGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F4332" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Modern Tech Hexagon / Squircle Badge -->
  <g filter="url(#monoGlow)">
    <!-- Base Squircle Container -->
    <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#monoEm)" stroke="url(#monoGold)" stroke-width="8"/>
    
    <!-- Subtle Inner Hexagonal Circuit Traces -->
    <g stroke="url(#monoGold)" stroke-width="2.5" opacity="0.35" fill="none" stroke-linecap="round">
      <path d="M 80 180 L 140 180 L 180 140 L 220 140"/>
      <circle cx="220" cy="140" r="4" fill="url(#monoGold)"/>

      <path d="M 432 180 L 372 180 L 332 140 L 292 140"/>
      <circle cx="292" cy="140" r="4" fill="url(#monoGold)"/>

      <path d="M 80 332 L 140 332 L 180 372 L 220 372"/>
      <circle cx="220" cy="372" r="4" fill="url(#monoGold)"/>

      <path d="M 432 332 L 372 332 L 332 372 L 292 372"/>
      <circle cx="292" cy="372" r="4" fill="url(#monoGold)"/>
    </g>

    <!-- Center Precision Engineered "IPTI" Glyph -->
    <!-- Geometric 'I' Pillar with Cap -->
    <g transform="translate(142, 160)">
      <rect x="0" y="32" width="28" height="130" rx="8" fill="url(#monoGold)"/>
      <circle cx="14" cy="10" r="14" fill="url(#monoGold)"/>
    </g>

    <!-- Geometric 'P' -->
    <g transform="translate(196, 160)">
      <rect x="0" y="0" width="28" height="192" rx="8" fill="#FFFFFF"/>
      <!-- Loop of P -->
      <path d="M 28 0 L 64 0 C 88 0 102 16 102 46 C 102 76 88 92 64 92 L 28 92 Z" fill="#FFFFFF"/>
      <path d="M 28 24 L 58 24 C 70 24 76 34 76 46 C 76 58 70 68 58 68 L 28 68 Z" fill="#0F4332"/>
    </g>

    <!-- Geometric 'T' -->
    <g transform="translate(308, 160)">
      <rect x="0" y="0" width="108" height="26" rx="8" fill="url(#monoGold)"/>
      <rect x="40" y="24" width="28" height="168" rx="8" fill="url(#monoGold)"/>
    </g>

    <!-- Geometric Second 'I' -->
    <g transform="translate(426, 160)">
      <rect x="0" y="32" width="28" height="130" rx="8" fill="#FFFFFF"/>
      <circle cx="14" cy="10" r="14" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Precision Tag -->
    <g transform="translate(256, 420)">
      <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#08251C" stroke="url(#monoGold)" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="url(#monoGold)" letter-spacing="3">
        INNOVATION CORE
      </text>
    </g>
  </g>
</svg>
